name: Browser Python runtime

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python3 scripts/fetch_silicon.py /tmp/actwright-silicon
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:static
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: static-runtime-results
          path: test-results/
